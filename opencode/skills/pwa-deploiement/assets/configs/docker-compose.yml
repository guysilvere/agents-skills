# docker-compose.yml — Prod/Staging : app SvelteKit (adapter-node)
# Les secrets sont injectés par Coolify (UI) — ne jamais les committer ici.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"                # adapter-node
    environment:
      - ORIGIN=https://<domaine>   # requis par adapter-node
      - DATABASE_URL=${DATABASE_URL}                 # libsql://<db>.turso.io
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - GENIUSPAY_API_KEY=${GENIUSPAY_API_KEY}
      - GENIUSPAY_API_SECRET=${GENIUSPAY_API_SECRET}
      - GENIUSPAY_WEBHOOK_SECRET=${GENIUSPAY_WEBHOOK_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Base de données : Turso (cloud).
# Aucun sidecar à héberger, sauvegarder ou mettre à jour.
# Sauvegardes : `turso db shell <db> .dump` → R2 (voir scripts/backup-r2.sh).
# Jobs planifiés : tâche planifiée Coolify appelant un endpoint protégé.
