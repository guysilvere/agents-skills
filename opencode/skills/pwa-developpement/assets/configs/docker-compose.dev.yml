# docker-compose.dev.yml — Développement local (Docker Desktop)
# Lancement : docker compose -f docker-compose.dev.yml up --build

services:
  # PWA SvelteKit — les server routes (webhooks, jobs) tournent dans ce même conteneur.
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=file:local.db          # ou libsql://<db>.turso.io (base de test Turso)
      - TURSO_AUTH_TOKEN=
      - GENIUSPAY_BASE_URL=https://geniuspay.ci/api/v1/merchant
      - GENIUSPAY_API_KEY=pk_sandbox_xxx    # SANDBOX uniquement en dev
      - GENIUSPAY_API_SECRET=sk_sandbox_xxx
      - ORIGIN=http://localhost:5173
    command: npm run dev -- --host 0.0.0.0

  # libSQL local (optionnel) — alternative à `file:local.db`.
  # Utile pour tester les migrations et les requêtes dans des conditions proches de la prod.
  # libsql:
  #   image: ghcr.io/tursodatabase/libsql-server:latest
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SQLD_NODE=primary
  #   volumes:
  #     - libsql_data:/var/lib/sqld

# Aucun conteneur de base n'est obligatoire : Turso est un service cloud,
# et `file:local.db` suffit pour développer.
# volumes:
#   libsql_data:
