# docker-compose.dev.yml — Développement local (OrbStack)
# Lancement : docker compose -f docker-compose.dev.yml up --build

services:
  # PWA SvelteKit — les server routes (webhooks, jobs) tournent dans ce même conteneur.
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=file:<projet>.local.db  # Base locale SQLite directe (aucun démon/conteneur requis)
      - TURSO_AUTH_TOKEN=
      - PAYMENT_BASE_URL=https://api.paiement.test
      - PAYMENT_API_KEY=pk_sandbox_xxx    # SANDBOX uniquement en dev
      - PAYMENT_API_SECRET=sk_sandbox_xxx
      - ORIGIN=http://localhost:5173
    command: npm run dev -- --host 0.0.0.0

# Aucun conteneur de base n'est requis : Turso est managé en prod/staging,
# et le fichier direct `file:<projet>.local.db` suffit pour développer en local.
